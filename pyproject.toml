[project]
name = "bagcount"
version = "0.1.0"
description = "Count bags loaded onto and unloaded from a truck from CCTV footage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "numpy>=1.26",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "lap>=0.5",
    "opencv-contrib-python>=4.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "albumentations>=2.0,<3",
    "rfdetr[onnx,train]>=1.12.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagcount"]

[tool.pytest.ini_options]
testpaths = ["tests"]

